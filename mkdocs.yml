site_name: VTS API Documentation
site_description: Comprehensive FastAPI-based system for managing users, templates, and AI-generated content
site_author: VTS Team
site_url: https://github.com/hoangpt/vts-api

repo_name: hoangpt/vts-api
repo_url: https://github.com/hoangpt/vts-api

docs_dir: docs_src

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - API Reference:
      - Overview: api/overview.md
      - User Management:
          - User Service: api/user-service.md
          - User Model: api/user-model.md
          - User Repository: api/user-repository.md
          - User Controller: api/user-controller.md
      - Configuration:
          - Database: api/database.md
          - RabbitMQ: api/rabbitmq.md
  - Development:
      - Setup: development/setup.md
      - Testing: development/testing.md
